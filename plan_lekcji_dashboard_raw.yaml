views:
  - title: Plan lekcji
    path: plan-lekcji
    icon: mdi:school
    cards:
      - type: horizontal-stack
        cards:
          - type: markdown
            content: >
              ## 👦 Wiktor

              <span style="font-size:1.3em;font-weight:bold;color:{{
              state_attr('sensor.aktualna_lekcja_wiktor','kolor') or
              'var(--primary-text-color)' }}">{{
              states('sensor.aktualna_lekcja_wiktor') }}</span>

              {% set sala = state_attr('sensor.aktualna_lekcja_wiktor','sala') %}
              {% set nau = state_attr('sensor.aktualna_lekcja_wiktor','nauczyciel') %}
              {% set grp = state_attr('sensor.aktualna_lekcja_wiktor','grupa') %}
              {% if sala or nau %}
              <small>{{ sala }}{% if nau %} • {{ nau }}{% endif %}{% if grp %} • {{ grp }}{% endif %}</small>
              {% endif %}

              ---

              **Następna:** {{ states('sensor.nastepna_lekcja_wiktor') }}
              {% set nstart = state_attr('sensor.nastepna_lekcja_wiktor','start') %}
              {% if nstart %}(od {{ as_timestamp(nstart) | timestamp_custom('%H:%M') }}){% endif %}
          - type: markdown
            content: >
              ## 👧 Gabrysia

              <span style="font-size:1.3em;font-weight:bold;color:{{
              state_attr('sensor.aktualna_lekcja_gabrysia','kolor') or
              'var(--primary-text-color)' }}">{{
              states('sensor.aktualna_lekcja_gabrysia') }}</span>

              {% set sala = state_attr('sensor.aktualna_lekcja_gabrysia','sala') %}
              {% set nau = state_attr('sensor.aktualna_lekcja_gabrysia','nauczyciel') %}
              {% set grp = state_attr('sensor.aktualna_lekcja_gabrysia','grupa') %}
              {% if sala or nau %}
              <small>{{ sala }}{% if nau %} • {{ nau }}{% endif %}{% if grp %} • {{ grp }}{% endif %}</small>
              {% endif %}

              ---

              **Następna:** {{ states('sensor.nastepna_lekcja_gabrysia') }}
              {% set nstart = state_attr('sensor.nastepna_lekcja_gabrysia','start') %}
              {% if nstart %}(od {{ as_timestamp(nstart) | timestamp_custom('%H:%M') }}){% endif %}

      # Godzina obiadu - encja powstaje DOPIERO gdy w opcjach integracji (dla KAŻDEGO
      # dziecka osobno) wskażesz ścieżkę do pliku .docx z harmonogramem stołówki
      # (Ustawienia -> Urządzenia i usługi -> Plan lekcji EduPage -> [dziecko] ->
      # Konfiguruj -> "Ścieżka do pliku .docx..."). Dopóki tego nie zrobisz dla
      # danego dziecka, ta karta pokaże "Nie znaleziono encji" dla niego - to
      # oczekiwane, nie błąd.
      - type: entities
        title: Obiad
        show_header_toggle: false
        entities:
          - entity: sensor.godzina_obiadu_wiktor
            name: Wiktor
            icon: mdi:food
          - entity: sensor.godzina_obiadu_gabrysia
            name: Gabrysia
            icon: mdi:food

      # Karta "Kalendarz" w tej wersji HA przyjmuje pod "entities" SAME stringi z ID
      # encji (nie obiekty z osobnym "color:" - to starszy/inny schemat, którego
      # edytor wizualny już nie obsługuje). Kolor per-kalendarz możesz i tak ustawić
      # ręcznie: kliknij encję na liście w edytorze karty -> "Kolor".
      - type: calendar
        title: Plan lekcji — tydzień
        initial_view: dayGridWeek
        entities:
          - calendar.plan_lekcji_wiktor
          - calendar.plan_lekcji_gabrysia

      # --- Poniższe karty DOPISZ dopiero wtedy, gdy skonfigurujesz w opcjach
      # integracji "Kalendarz z dodatkowymi zajęciami" (CONF_EXTRA_CALENDAR_ENTITY)
      # dla danego dziecka - wskazujesz tam SWÓJ WŁASNY kalendarz HA (np. z
      # integracji "Kalendarz lokalny"), do którego sam dodajesz kółka/korepetycje.
      # Dopóki tej opcji nie ustawisz, encje calendar.zajecia_dodatkowe_bez_kolizji_*
      # i binary_sensor.kolizja_zajec_z_lekcja_* W OGÓLE NIE ISTNIEJĄ - stąd puste,
      # wiecznie "ładujące się" karty, gdybyś je tu wkleił(a) za wcześnie.
      #
      # - type: conditional
      #   conditions:
      #     - condition: state
      #       entity: binary_sensor.kolizja_zajec_z_lekcja_wiktor
      #       state: "on"
      #   card:
      #     type: markdown
      #     content: >
      #       ### ⚠️ Kolizja zajęć — Wiktor
      #
      #       {% for k in state_attr('binary_sensor.kolizja_zajec_z_lekcja_wiktor','kolidujace_zajecia') or [] %}
      #       - **{{ k.zajecia }}** koliduje z lekcją **{{ k.lekcja }}**
      #         ({{ as_timestamp(k.lekcja_start) | timestamp_custom('%H:%M') }})
      #       {% endfor %}
      #
      # - type: conditional
      #   conditions:
      #     - condition: state
      #       entity: binary_sensor.kolizja_zajec_z_lekcja_gabrysia
      #       state: "on"
      #   card:
      #     type: markdown
      #     content: >
      #       ### ⚠️ Kolizja zajęć — Gabrysia
      #
      #       {% for k in state_attr('binary_sensor.kolizja_zajec_z_lekcja_gabrysia','kolidujace_zajecia') or [] %}
      #       - **{{ k.zajecia }}** koliduje z lekcją **{{ k.lekcja }}**
      #         ({{ as_timestamp(k.lekcja_start) | timestamp_custom('%H:%M') }})
      #       {% endfor %}
      #
      # - type: calendar
      #   title: Zajęcia dodatkowe (bez kolizji)
      #   initial_view: listWeek
      #   entities:
      #     - calendar.zajecia_dodatkowe_bez_kolizji_wiktor
      #     - calendar.zajecia_dodatkowe_bez_kolizji_gabrysia

  # Drugi widok - "papierowy" plan tygodnia (siatka dni x godzin, kolorowe pola per
  # przedmiot, sala/nauczyciel w komórce, legenda na dole) - wzorowany na plakacie
  # planu lekcji, jaki dostaje się ze szkoły. Dane bierze z encji
  # sensor.plan_tygodnia_<dziecko> (atrybuty "dni"/"siatka"/"legenda" - patrz
  # sensor.py: EdupageWeekGridSensor/build_week_grid). Ta encja istnieje ZAWSZE,
  # więc w przeciwieństwie do karty "Obiad" ten widok nie wymaga żadnej dodatkowej
  # konfiguracji w opcjach integracji.
  - title: Plan tygodnia
    path: plan-tygodnia
    icon: mdi:calendar-week
    cards:
      - type: markdown
        title: 👦 Wiktor — plan tygodnia
        content: >
          {% set ent = 'sensor.plan_tygodnia_wiktor' %}
          {% set dni = state_attr(ent, 'dni') or [] %}
          {% set siatka = state_attr(ent, 'siatka') or [] %}
          {% set legenda = state_attr(ent, 'legenda') or [] %}
          {% if not siatka %}
          Brak danych planu na ten tydzień.
          {% else %}
          <table style="width:100%; border-collapse:collapse; text-align:center; font-size:0.85em;">
          <tr>
            <th style="padding:4px;"></th>
            {% for d in dni %}
            <th style="padding:4px; border-bottom:2px solid var(--divider-color);">{{ d.nazwa }}<br><small>{{ d.data }}</small></th>
            {% endfor %}
          </tr>
          {% for row in siatka %}
          <tr>
            <td style="padding:4px; white-space:nowrap; font-size:0.8em; color:var(--secondary-text-color);">{{ row.start }}<br>{{ row.koniec }}</td>
            {% for cell in row.dni %}
            {% if cell %}
            <td style="padding:6px 4px; border-radius:8px; background:{{ cell.kolor }}33;">
              <div style="font-weight:bold;">{{ cell.skrot }}</div>
              {% if cell.sala %}<div style="font-size:0.8em;">s. {{ cell.sala }}</div>{% endif %}
              {% if cell.nauczyciel %}<div style="font-size:0.75em; color:var(--secondary-text-color);">{{ cell.nauczyciel }}</div>{% endif %}
            </td>
            {% else %}
            <td></td>
            {% endif %}
            {% endfor %}
          </tr>
          {% endfor %}
          </table>

          {% if legenda %}
          <div style="margin-top:10px; font-size:0.8em;">
          {% for l in legenda %}
          <span style="display:inline-block; margin:2px 8px 2px 0;"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:{{ l.kolor }};margin-right:4px;"></span>{{ l.skrot }} = {{ l.przedmiot }}</span>
          {% endfor %}
          </div>
          {% endif %}
          {% endif %}

      - type: markdown
        title: 👧 Gabrysia — plan tygodnia
        content: >
          {% set ent = 'sensor.plan_tygodnia_gabrysia' %}
          {% set dni = state_attr(ent, 'dni') or [] %}
          {% set siatka = state_attr(ent, 'siatka') or [] %}
          {% set legenda = state_attr(ent, 'legenda') or [] %}
          {% if not siatka %}
          Brak danych planu na ten tydzień.
          {% else %}
          <table style="width:100%; border-collapse:collapse; text-align:center; font-size:0.85em;">
          <tr>
            <th style="padding:4px;"></th>
            {% for d in dni %}
            <th style="padding:4px; border-bottom:2px solid var(--divider-color);">{{ d.nazwa }}<br><small>{{ d.data }}</small></th>
            {% endfor %}
          </tr>
          {% for row in siatka %}
          <tr>
            <td style="padding:4px; white-space:nowrap; font-size:0.8em; color:var(--secondary-text-color);">{{ row.start }}<br>{{ row.koniec }}</td>
            {% for cell in row.dni %}
            {% if cell %}
            <td style="padding:6px 4px; border-radius:8px; background:{{ cell.kolor }}33;">
              <div style="font-weight:bold;">{{ cell.skrot }}</div>
              {% if cell.sala %}<div style="font-size:0.8em;">s. {{ cell.sala }}</div>{% endif %}
              {% if cell.nauczyciel %}<div style="font-size:0.75em; color:var(--secondary-text-color);">{{ cell.nauczyciel }}</div>{% endif %}
            </td>
            {% else %}
            <td></td>
            {% endif %}
            {% endfor %}
          </tr>
          {% endfor %}
          </table>

          {% if legenda %}
          <div style="margin-top:10px; font-size:0.8em;">
          {% for l in legenda %}
          <span style="display:inline-block; margin:2px 8px 2px 0;"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:{{ l.kolor }};margin-right:4px;"></span>{{ l.skrot }} = {{ l.przedmiot }}</span>
          {% endfor %}
          </div>
          {% endif %}
          {% endif %}
